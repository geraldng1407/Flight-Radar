name: Update Flight Data

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

# Prevent concurrent runs - cancel in-progress if new one starts
concurrency:
  group: flight-data-update
  cancel-in-progress: true

permissions:
  contents: write  # Required to push commits

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run flight data ingestion
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python src/fetch_flights.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/flights.csv
          git diff --staged --quiet || git commit -m "Update flight data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
